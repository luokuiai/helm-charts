{{ template "openbao.mode" . }}
{{- if ne .mode "external" }}
{{- if .Values.server.ingress.enabled -}}
{{- $certificate := .Values.server.ingress.certificate -}}
{{- $annotations := deepCopy .Values.server.ingress.annotations -}}
{{- if kindIs "string" $annotations -}}
{{- $annotations = tpl $annotations . | fromYaml -}}
{{- end -}}
{{- if not .Values.server.ingress.hosts -}}
{{- fail "server.ingress.hosts must contain at least one hostname" -}}
{{- end -}}
{{- if and (ne $certificate.mode "disabled") .Values.server.ingress.tls -}}
{{- fail "Use either server.ingress.certificate or server.ingress.tls, not both" -}}
{{- end -}}
{{- if eq $certificate.mode "cert-manager" -}}
{{- $issuer := required "server.ingress.certificate.issuerName is required for cert-manager" $certificate.issuerName -}}
{{- $_ := unset $annotations "cert-manager.io/issuer" -}}
{{- $_ := unset $annotations "cert-manager.io/cluster-issuer" -}}
{{- if eq $certificate.issuerKind "ClusterIssuer" -}}
{{- $_ := set $annotations "cert-manager.io/cluster-issuer" $issuer -}}
{{- else -}}
{{- $_ := set $annotations "cert-manager.io/issuer" $issuer -}}
{{- end -}}
{{- end -}}
{{- $extraPaths := .Values.server.ingress.extraPaths -}}
{{- $serviceName := include "openbao.fullname" . -}}
{{- template "openbao.serverServiceEnabled" . -}}
{{- if .serverServiceEnabled -}}
{{- if and (eq .mode "ha" ) (eq (.Values.server.ingress.activeService | toString) "true") }}
{{- $serviceName = printf "%s-%s" $serviceName "active" -}}
{{- end }}
{{- $servicePort := .Values.server.service.port -}}
{{- $pathType := .Values.server.ingress.pathType -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ template "openbao.fullname" . }}
  namespace: {{ include "openbao.namespace" . }}
  labels:
    helm.sh/chart: {{ include "openbao.chart" . }}
    app.kubernetes.io/name: {{ include "openbao.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    {{- with .Values.server.ingress.labels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $annotations }}
  annotations: {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
spec:
{{- if ne $certificate.mode "disabled" }}
  tls:
    - secretName: {{ required "server.ingress.certificate.secretName is required for HTTPS" $certificate.secretName | quote }}
      hosts:
      {{- range .Values.server.ingress.hosts }}
        - {{ required "server.ingress.hosts[].host is required" .host | quote }}
      {{- end }}
{{- else if .Values.server.ingress.tls }}
  tls:
  {{- range .Values.server.ingress.tls }}
    - hosts:
      {{- range .hosts }}
        - {{ . | quote }}
      {{- end }}
      secretName: {{ .secretName }}
  {{- end }}
{{- end }}
{{- if .Values.server.ingress.ingressClassName }}
  ingressClassName: {{ .Values.server.ingress.ingressClassName }}
{{- end }}
  rules:
  {{- range .Values.server.ingress.hosts }}
    - host: {{ required "server.ingress.hosts[].host is required" .host | quote }}
      http:
        paths:
{{ if $extraPaths }}
{{ toYaml $extraPaths | indent 10 }}
{{- end }}
        {{- range (.paths | default (list "/")) }}
          - path: {{ . }}
            pathType: {{ $pathType }}
            backend:
              service:
                name: {{ $serviceName }}
                port:
                  number: {{ $servicePort }}
        {{- end }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
