questions:
  - variable: image.repository
    label: "Magpie image repository"
    type: string
    default: ghcr.io/yetone/magpie
    required: true
    group: "Images"
    description: "Official headless Magpie image, or a compatible mirror. Supports amd64 and arm64."
  - variable: image.tag
    label: "Magpie image tag (optional)"
    type: string
    default: ""
    group: "Images"
    description: "Leave empty to use the pinned 0.1.1734 version. Upstream Docker tags omit the leading v."
  - variable: auth.useExistingSecret
    label: "Use an existing Web key Secret"
    type: boolean
    default: "false"
    required: true
    group: "Web administration"
    description: "The Web key gives administrative access, including provider credentials. API clients use separate gateway keys created in Magpie."
  - variable: auth.webKey
    label: "Web administration key"
    type: password
    default: ""
    required: true
    group: "Web administration"
    show_if: auth.useExistingSecret=false
    description: "Use a random key of at least 16 characters: letters, digits, - . _ ~. Generate one with openssl rand -hex 16. Helm release values retain this key; use an existing Secret to keep it out of values."
  - variable: auth.existingSecret
    label: "Existing Web key Secret name"
    type: string
    default: ""
    required: true
    group: "Web administration"
    show_if: auth.useExistingSecret=true
    description: "Must exist in the installation namespace."
  - variable: auth.secretKey
    label: "Web key field in Secret"
    type: string
    default: MAGPIE_WEB_KEY
    required: true
    group: "Web administration"
    description: "The Secret field mapped to MAGPIE_WEB_KEY. Applies to generated and existing Secrets."
  - variable: persistence.existingClaim
    label: "Existing config PVC (optional)"
    type: string
    default: ""
    group: "Persistence"
    description: "Leave empty to create a PVC for /config. An existing claim must be in this namespace and writable by UID/GID 65532. Do not switch claims after installation without migrating data."
  - variable: persistence.storageClass
    label: "Config storage class"
    type: storageclass
    default: local-path
    group: "Persistence"
    description: "Used when creating a PVC. Leave empty to use the cluster default. local-path keeps data on the assigned K3s node."
  - variable: persistence.size
    label: "Initial config storage size"
    type: string
    default: 1Gi
    required: true
    group: "Persistence"
    description: "Stores settings, provider keys, sign-ins, plugins, caches, and usage. Resize existing PVCs separately. The chart retains the PVC on uninstall."
  - variable: ingress.enabled
    label: "Enable domain access (Ingress)"
    type: boolean
    default: "false"
    required: true
    group: "Domain / HTTPS"
    description: "One domain serves the Web UI and gateway API through port 3430. Requires an existing Ingress controller and a DNS record."
  - variable: ingress.hosts.0.host
    label: "Hostname"
    type: hostname
    default: magpie.example.com
    required: true
    group: "Domain / HTTPS"
    show_if: ingress.enabled=true
    description: "Enter only the hostname. The UI uses / and OpenAI-compatible clients use /v1."
  - variable: ingress.className
    label: "Ingress Class"
    type: "reference[networking.k8s.io.ingressclass]"
    default: ""
    group: "Domain / HTTPS"
    show_if: ingress.enabled=true
    description: "Usually traefik on K3s. Leave empty to use the default Ingress Class."
  - variable: ingress.certificate.mode
    label: "HTTPS mode"
    type: enum
    default: disabled
    required: true
    options:
      - disabled
      - existing
      - cert-manager
    group: "Domain / HTTPS"
    show_if: ingress.enabled=true
    description: "existing: an existing TLS Secret; cert-manager: request a certificate from an existing issuer; disabled: HTTP. Use HTTPS or a private tunnel for remote access."
  - variable: ingress.certificate.issuerKind
    label: "Certificate issuer kind"
    type: enum
    default: ClusterIssuer
    required: true
    options:
      - ClusterIssuer
      - Issuer
    group: "Domain / HTTPS"
    show_if: ingress.enabled=true&&ingress.certificate.mode=cert-manager
  - variable: ingress.certificate.issuerName
    label: "Certificate issuer name"
    type: "reference[cert-manager.io.clusterissuer]"
    default: ""
    required: true
    group: "Domain / HTTPS"
    show_if: ingress.enabled=true&&ingress.certificate.mode=cert-manager&&ingress.certificate.issuerKind=ClusterIssuer
    description: "Select an existing, ready ClusterIssuer. Install cert-manager first."
  # Separate issuer selectors so Rancher remounts the selector when the kind changes.
  - variable: ingress.certificate.secretName
    label: "TLS Secret name"
    type: string
    default: magpie-tls
    required: true
    group: "Domain / HTTPS"
    show_if: ingress.enabled=true
    description: "An existing Secret in existing mode; the Secret to create in cert-manager mode. Ignored in disabled mode."
  - variable: ingress.certificate.issuerName
    label: "Certificate issuer name"
    type: "reference[cert-manager.io.issuer]"
    default: ""
    required: true
    group: "Domain / HTTPS"
    show_if: ingress.enabled=true&&ingress.certificate.mode=cert-manager&&ingress.certificate.issuerKind=Issuer
    description: "Select an existing, ready Issuer in the installation namespace."
  - variable: magpie.publicURL
    label: "Public base URL override (optional)"
    type: string
    default: ""
    group: "Domain / HTTPS"
    description: "Leave empty to derive the http(s)://hostname from Ingress. Override when using a separate reverse proxy. Do not append /v1; this URL serves both the Web UI and gateway API."
  - variable: resources.requests.cpu
    label: "CPU request"
    type: string
    default: 100m
    required: true
    group: "CPU / memory"
  - variable: resources.limits.cpu
    label: "CPU limit"
    type: string
    default: 1000m
    required: true
    group: "CPU / memory"
  - variable: resources.requests.memory
    label: "Memory request"
    type: string
    default: 256Mi
    required: true
    group: "CPU / memory"
  - variable: resources.limits.memory
    label: "Memory limit"
    type: string
    default: 1Gi
    required: true
    group: "CPU / memory"
    description: "Increase if optional provider CLIs or plugins require more memory."
