questions:
  - variable: image.repository
    label: "Magpie 镜像"
    type: string
    default: ghcr.io/yetone/magpie:0.1.1836
    required: true
    group: "镜像"
    description: "填写包含版本的完整镜像地址，例如 ghcr.io/yetone/magpie:0.1.1836 或 registry.example.com/team/magpie:0.1.1836。官方无界面镜像支持 amd64 和 arm64。"
  - variable: magpie.envSecret
    label: "Magpie 环境变量 Secret"
    type: "reference[secret]"
    default: magpie-env
    required: true
    group: "环境变量"
    description: "选择安装命名空间中的已有 Secret，包含 MAGPIE_WEB_KEY 等 Magpie 环境变量。Web 密钥至少 16 个字符，可使用字母、数字及 - . _ ~。更新 Secret 后需重启 Deployment。API 客户端使用在 Magpie 中单独创建的网关密钥。"
  - variable: persistence.existingClaim
    label: "已有配置 PVC（可选）"
    type: string
    default: ""
    group: "持久化存储"
    description: "留空则为 /config 创建 PVC。已有 PVC 必须位于安装命名空间，且 UID/GID 65532 可写。安装后若要更换 PVC，需先迁移数据。"
  - variable: persistence.storageClass
    label: "配置存储类"
    type: storageclass
    default: local-path
    group: "持久化存储"
    description: "创建 PVC 时使用。留空使用集群默认存储类。local-path 将数据保存在分配到的 K3s 节点上。"
  - variable: persistence.size
    label: "初始配置存储容量"
    type: string
    default: 1Gi
    required: true
    group: "持久化存储"
    description: "保存设置、提供商密钥、登录信息、插件、缓存和用量数据。已有 PVC 需单独扩容，卸载时会保留 PVC。"
  - variable: ingress.enabled
    label: "启用域名访问（Ingress）"
    type: boolean
    default: "false"
    required: true
    group: "域名 / HTTPS"
    description: "通过 3430 端口，用一个域名同时提供 Web 界面和网关 API。需已有 Ingress 控制器及 DNS 解析记录。"
  - variable: ingress.hosts.0.host
    label: "域名"
    type: hostname
    default: magpie.example.com
    required: true
    group: "域名 / HTTPS"
    show_if: ingress.enabled=true
    description: "只填写域名。Web 界面使用 /，兼容 OpenAI 的客户端使用 /v1。"
  - variable: ingress.className
    label: "Ingress 类"
    type: "reference[networking.k8s.io.ingressclass]"
    default: ""
    group: "域名 / HTTPS"
    show_if: ingress.enabled=true
    description: "K3s 通常选择 traefik；留空使用默认 Ingress 类。"
  - variable: ingress.certificate.mode
    label: "HTTPS 模式"
    type: enum
    default: disabled
    required: true
    options:
      - disabled
      - existing
      - cert-manager
    group: "域名 / HTTPS"
    show_if: ingress.enabled=true
    description: "existing：使用已有 TLS Secret；cert-manager：通过已有签发器申请证书；disabled：使用 HTTP。远程访问请使用 HTTPS 或私有隧道。"
  - variable: ingress.certificate.issuerKind
    label: "证书签发器类型"
    type: enum
    default: ClusterIssuer
    required: true
    options:
      - ClusterIssuer
      - Issuer
    group: "域名 / HTTPS"
    show_if: ingress.enabled=true&&ingress.certificate.mode=cert-manager
  - variable: ingress.certificate.issuerName
    label: "证书签发器名称"
    type: "reference[cert-manager.io.clusterissuer]"
    default: ""
    required: true
    group: "域名 / HTTPS"
    show_if: ingress.enabled=true&&ingress.certificate.mode=cert-manager&&ingress.certificate.issuerKind=ClusterIssuer
    description: "选择已有且就绪的 ClusterIssuer。需先安装 cert-manager。"
  # Separate issuer selectors so Rancher remounts the selector when the kind changes.
  - variable: ingress.certificate.secretName
    label: "TLS Secret 名称"
    type: string
    default: magpie-tls
    required: true
    group: "域名 / HTTPS"
    show_if: ingress.enabled=true
    description: "existing 模式填写已有 Secret；cert-manager 模式填写要创建的 Secret 名称。disabled 模式忽略此项。"
  - variable: ingress.certificate.issuerName
    label: "证书签发器名称"
    type: "reference[cert-manager.io.issuer]"
    default: ""
    required: true
    group: "域名 / HTTPS"
    show_if: ingress.enabled=true&&ingress.certificate.mode=cert-manager&&ingress.certificate.issuerKind=Issuer
    description: "选择安装命名空间中已有且就绪的 Issuer。"
  - variable: magpie.publicURL
    label: "自定义外部访问地址（可选）"
    type: string
    default: ""
    group: "域名 / HTTPS"
    description: "留空则根据 Ingress 自动生成 http(s)://域名。使用独立反向代理时可手动填写。不要添加 /v1；此地址同时用于 Web 界面和网关 API。"
  - variable: nodeName
    label: "目标节点（可选）"
    type: "reference[node]"
    default: ""
    group: "节点调度"
    description: "从集群节点下拉列表中选择目标节点；留空表示不限制节点。local-path PVC 绑定节点后，修改此项不会迁移数据。"
  - variable: resources.requests.cpu
    label: "CPU 请求量"
    type: string
    default: 100m
    required: true
    group: "CPU / 内存"
  - variable: resources.limits.cpu
    label: "CPU 上限"
    type: string
    default: 1000m
    required: true
    group: "CPU / 内存"
  - variable: resources.requests.memory
    label: "内存请求量"
    type: string
    default: 256Mi
    required: true
    group: "CPU / 内存"
  - variable: resources.limits.memory
    label: "内存上限"
    type: string
    default: 1Gi
    required: true
    group: "CPU / 内存"
    description: "若可选的提供商命令行工具或插件需要更多内存，请提高此值。"
