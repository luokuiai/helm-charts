{{- if and (not .Values.magpie.envSecret) (not .Values.auth.useExistingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "magpie.secretName" . }}
  labels:
    {{- include "magpie.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.auth.secretKey }}: {{ required "auth.webKey is required unless auth.useExistingSecret=true" .Values.auth.webKey | b64enc | quote }}
{{- end }}
