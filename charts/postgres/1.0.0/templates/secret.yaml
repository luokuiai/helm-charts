{{- if not .Values.auth.useExistingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgres.secretName" . }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.auth.secretKey | quote }}: {{ required "Set auth.password or use an existing Secret" .Values.auth.password | b64enc | quote }}
{{- end }}
