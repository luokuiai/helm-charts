image:
  # Full PostgreSQL 18 image reference, including its version or digest.
  repository: postgres:18.6
  pullPolicy: IfNotPresent

postgres:
  # Existing Secret containing POSTGRES_PASSWORD and other initialization variables.
  envSecret: postgres-env

auth:
  username: postgres
  # Empty uses POSTGRES_DB from the environment Secret, or the initial username.
  database: ""
  # Legacy fallback used only when postgres.envSecret is empty.
  password: ""
  useExistingSecret: false
  existingSecret: ""
  secretKey: password

persistence:
  # An existing claim must be in the release namespace and contain compatible PG18 data.
  existingClaim: ""
  storageClass: local-path
  size: 10Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi
