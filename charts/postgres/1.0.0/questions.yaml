questions:
  - variable: image.repository
    label: "PostgreSQL image"
    type: string
    default: postgres:18.6
    required: true
    group: "Images"
    description: "Full PostgreSQL 18 image including its version, such as postgres:18.6 or registry.example.com/team/postgres:18.6. This chart supports PostgreSQL 18 only."
  - variable: postgres.envSecret
    label: "PostgreSQL environment Secret"
    type: "reference[secret]"
    default: postgres-env
    required: true
    group: "Database and authentication"
    description: "Select an existing Secret in the installation namespace containing POSTGRES_PASSWORD. Its entries are injected as environment variables. The password initializes empty storage only; changing the Secret does not change an existing database password."
  - variable: auth.username
    label: "Initial administrator username"
    type: string
    default: postgres
    required: true
    group: "Database and authentication"
    description: "Used only when initializing an empty data directory. This user has superuser privileges."
  - variable: auth.database
    label: "Initial database name (optional)"
    type: string
    default: ""
    group: "Database and authentication"
    description: "Leave empty to use POSTGRES_DB from the environment Secret, or default to the initial username. Used only when initializing empty storage. Additional databases can be created later."
  - variable: persistence.existingClaim
    label: "Existing PVC name (optional)"
    type: string
    default: ""
    group: "Persistence"
    description: "Leave empty to create a PVC. Otherwise, use an existing PVC in the installation namespace and ignore the storage class and size below. Do not switch after installation."
  - variable: persistence.storageClass
    label: "Storage class"
    type: storageclass
    default: local-path
    group: "Persistence"
    description: "Used when creating a PVC. local-path stores data on the local disk of the node running the Pod."
  - variable: persistence.size
    label: "Initial storage size"
    type: string
    default: 10Gi
    required: true
    group: "Persistence"
    description: "Used only when creating a PVC. After installation, check storage class capabilities and resize the PVC separately instead of changing this field."
  - variable: resources.requests.cpu
    label: "CPU request"
    type: string
    default: 100m
    required: true
    group: "CPU / memory"
    description: "1000m equals 1 CPU core."
  - variable: resources.limits.cpu
    label: "CPU limit"
    type: string
    default: 1000m
    required: true
    group: "CPU / memory"
  - variable: resources.requests.memory
    label: "Memory request"
    type: string
    default: 256Mi
    required: true
    group: "CPU / memory"
  - variable: resources.limits.memory
    label: "Memory limit"
    type: string
    default: 1Gi
    required: true
    group: "CPU / memory"
