questions:
  - variable: replicaCount
    default: 1
    required: true
    type: int
    min: 1
    label: Caddy 副本数
    group: 应用

  - variable: upstreamHost
    default: registry-upstream.example.com
    required: true
    type: hostname
    label: 私有仓库上游域名
    description: 只填上游仓库域名，不带协议、端口或路径；上游使用 HTTPS 443。阿里云 ACR 个人版应选不含 -vpc 的公网域名。
    group: 代理配置
  - variable: upstreamNamespace
    default: ""
    type: string
    label: 私有仓库上游命名空间（可选）
    description: "如上游镜像是 upstream.example.com/myteam/intelliconf:1.3.2，填 myteam 后可拉取代理域名/intelliconf:1.3.2。只填一个命名空间段，不带斜杠；留空则原样转发路径。"
    group: 代理配置
  - variable: auth.realmURL
    default: ""
    type: string
    label: 上游令牌认证地址
    description: "设置上游命名空间时必填。填写上游 /v2/ 的 WWW-Authenticate 响应中 realm 的完整 HTTPS 地址，须包含路径；不带端口、查询参数或账号信息。例如 https://dockerauth-cn-chengdu.aliyuncs.com/auth。"
    group: 代理配置
  - variable: publicProxy.enabled
    default: true
    type: boolean
    label: 启用公共镜像代理
    group: 代理配置
  - variable: publicProxy.rateLimit.enabled
    default: true
    type: boolean
    label: 启用公共入口限流
    description: 仅限制公网镜像域名的请求，按 Traefik 看到的客户端 IP 计数；需要集群已安装 Traefik Middleware CRD。
    show_if: "ingress.enabled=true&&publicProxy.enabled=true"
    group: 代理配置
  - variable: publicProxy.rateLimit.average
    default: 5
    required: true
    type: int
    min: 1
    label: 每秒平均请求数（每 IP）
    show_if: "ingress.enabled=true&&publicProxy.enabled=true&&publicProxy.rateLimit.enabled=true"
    group: 代理配置
  - variable: publicProxy.rateLimit.burst
    default: 30
    required: true
    type: int
    min: 1
    label: 瞬时突发请求数（每 IP）
    description: 允许短时间连续通过的请求数，额度耗尽后按每秒平均请求数恢复；过低可能影响镜像拉取。
    show_if: "ingress.enabled=true&&publicProxy.enabled=true&&publicProxy.rateLimit.enabled=true"
    group: 代理配置
  - variable: publicProxy.rateLimit.safeNaming
    default: false
    type: boolean
    label: Traefik 已启用 safeNaming
    description: 仅当 Traefik Kubernetes CRD provider 设置 safeNaming=true 时勾选，否则保持关闭。
    show_if: "ingress.enabled=true&&publicProxy.enabled=true&&publicProxy.rateLimit.enabled=true"
    group: 代理配置
  - variable: publicProxy.upstreams
    default:
      - https://gh-proxy.org
      - https://v4.gh-proxy.org
      - https://v6.gh-proxy.org
      - https://cdn.gh-proxy.org
    required: true
    type: "array[string]"
    label: 公共镜像上游地址
    description: 至少保留一个 HTTPS 地址，可添加、删除或修改。镜像层下载会跳转到第一项，拉取机器必须能直连；其他请求按列表顺序选择上游。只填写协议、域名和可选端口，不带路径；上游须兼容现有 gh-proxy 路径规则。
    show_if: "publicProxy.enabled=true"
    group: 代理配置

  - variable: ingress.enabled
    default: true
    required: true
    type: boolean
    label: 启用域名访问（Ingress）
    description: 通过 Ingress 提供两个代理入口，域名解析需在 DNS 服务商处配置。
    group: 域名 / HTTPS
  - variable: ingress.host
    default: registry.example.com
    required: true
    type: hostname
    label: 私有仓库代理域名
    description: 填写访问代理时使用的域名，不带协议和路径。
    show_if: "ingress.enabled=true"
    group: 域名 / HTTPS
  - variable: publicProxy.host
    default: docker.example.com
    required: true
    type: hostname
    label: 公共镜像代理域名
    description: 使用独立域名，不能与私有仓库代理域名相同。
    show_if: "ingress.enabled=true&&publicProxy.enabled=true"
    group: 域名 / HTTPS
  - variable: ingress.className
    default: traefik
    type: "reference[networking.k8s.io.ingressclass]"
    label: Ingress Class
    description: 从集群现有的 Ingress Class 中选择，K3s 通常选择 traefik；留空使用集群默认 Ingress Class。
    show_if: "ingress.enabled=true"
    group: 域名 / HTTPS
  - variable: ingress.clusterIssuer
    default: letsencrypt
    type: "reference[cert-manager.io.clusterissuer]"
    label: 证书签发器 ClusterIssuer
    description: 从集群现有的 ClusterIssuer 中选择。使用已有证书时清空选择，并填写下方 TLS Secret 名称。
    show_if: "ingress.enabled=true"
    group: 域名 / HTTPS
  - variable: ingress.tls.secretName
    default: ""
    type: string
    label: 私有仓库 TLS Secret 名称
    description: 自动签发时留空使用安装名称加 -tls；使用已有证书时填写安装命名空间内的 TLS Secret 名称。
    show_if: "ingress.enabled=true"
    group: 域名 / HTTPS
  - variable: publicProxy.tls.secretName
    default: ""
    type: string
    label: 公共镜像 TLS Secret 名称
    description: 自动签发时留空使用安装名称加 -public-tls，且须与私有入口不同；使用已有证书时，可共享覆盖两个域名的同一 TLS Secret。
    show_if: "ingress.enabled=true&&publicProxy.enabled=true"
    group: 域名 / HTTPS
