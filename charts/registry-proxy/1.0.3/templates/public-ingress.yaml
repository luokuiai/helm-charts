{{- if and .Values.ingress.enabled .Values.publicProxy.enabled }}
{{- if eq .Values.ingress.host .Values.publicProxy.host }}
{{- fail "publicProxy.host must differ from ingress.host to keep public ping responses separate from upstream registry authentication." }}
{{- end }}
{{- if and (not .Values.ingress.clusterIssuer) (not .Values.publicProxy.tls.secretName) }}
{{- fail "Set ingress.clusterIssuer for automatic issuance, or publicProxy.tls.secretName for the existing public TLS Secret." }}
{{- end }}
{{- $registryTLSSecretName := default (printf "%s-tls" .Release.Name) .Values.ingress.tls.secretName }}
{{- $publicTLSSecretName := default (printf "%s-public-tls" .Release.Name) .Values.publicProxy.tls.secretName }}
{{- if and .Values.ingress.clusterIssuer (eq $registryTLSSecretName $publicTLSSecretName) }}
{{- fail "自动签发时，仓库入口与公共入口的 TLS Secret 名称必须不同；如需共享已有证书，请清空 ingress.clusterIssuer，并确保证书覆盖两个域名。" }}
{{- end }}
{{- $annotations := deepCopy (.Values.ingress.annotations | default dict) }}
{{- $_ := unset $annotations "cert-manager.io/issuer" }}
{{- $_ := unset $annotations "cert-manager.io/cluster-issuer" }}
{{- $_ := unset $annotations "kubernetes.io/tls-acme" }}
{{- if .Values.ingress.clusterIssuer }}
{{- $_ := set $annotations "cert-manager.io/cluster-issuer" .Values.ingress.clusterIssuer }}
{{- end }}
{{- if .Values.publicProxy.rateLimit.enabled }}
{{- $separator := ternary "_" "-" .Values.publicProxy.rateLimit.safeNaming }}
{{- $middlewareRef := printf "%s%s%s-public-ratelimit@kubernetescrd" .Release.Namespace $separator .Release.Name }}
{{- $existingMiddlewares := get $annotations "traefik.ingress.kubernetes.io/router.middlewares" }}
{{- if $existingMiddlewares }}
{{- $middlewareRef = printf "%s,%s" $existingMiddlewares $middlewareRef }}
{{- end }}
{{- $_ := set $annotations "traefik.ingress.kubernetes.io/router.middlewares" $middlewareRef }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-public
  namespace: {{ .Release.Namespace }}
  {{- with $annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  tls:
    - hosts:
        - {{ .Values.publicProxy.host | quote }}
      secretName: {{ $publicTLSSecretName | quote }}
  rules:
    - host: {{ .Values.publicProxy.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  number: 8081
{{- end }}
