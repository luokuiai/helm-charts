{{- if not .Values.database.useExistingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "casdoor.databaseSecretName" . }}
  labels:
    {{- include "casdoor.labels" . | nindent 4 }}
type: Opaque
data:
  dataSourceName: {{ include "casdoor.dataSourceName" . | b64enc | quote }}
{{- end }}
