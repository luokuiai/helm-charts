questions:
  - variable: image.repository
    label: "Casdoor image"
    type: string
    default: casbin/casdoor:v4.24.0
    required: true
    group: "Images"
    description: "Full image including its version or digest, such as casbin/casdoor:v4.24.0 or registry.example.com/team/casdoor:v4.24.0."
  - variable: casdoor.envSecret
    label: "Casdoor environment Secret"
    type: "reference[secret]"
    default: casdoor-env
    required: true
    group: "External database"
    description: "Select an existing Secret in this namespace containing dataSourceName and other Casdoor environment variables, such as initAdminPassword. Shared with Caddy when enabled; add S3_ENDPOINT and S3_BUCKET there. Variable names are case-sensitive. Restart the Deployment after updating it. S3 providers can be automatically imported from init_data.yaml in the same Secret."
  - variable: database.driver
    label: "External database type"
    type: enum
    default: postgres
    required: true
    options:
      - postgres
      - mysql
    group: "External database"
    description: "Use an existing PostgreSQL or MySQL server. This chart does not install a database."
  - variable: database.databaseName
    label: "Database name"
    type: string
    default: casdoor
    required: true
    group: "External database"
    description: "Create a dedicated database and grant the user permission to create and migrate its tables."
  - variable: ingress.enabled
    label: "Enable domain access (Ingress)"
    type: boolean
    default: "false"
    required: true
    group: "Domain / HTTPS"
    description: "Requires an existing Ingress controller. Configure DNS separately."
  - variable: ingress.hosts.0.host
    label: "Hostname"
    type: hostname
    default: casdoor.example.com
    required: true
    group: "Domain / HTTPS"
    show_if: ingress.enabled=true
    description: "Enter only the hostname, without https:// or a path."
  - variable: ingress.className
    label: "Ingress Class"
    type: "reference[networking.k8s.io.ingressclass]"
    default: ""
    group: "Domain / HTTPS"
    show_if: ingress.enabled=true
    description: "Usually traefik on K3s. Leave empty to use the default Ingress Class."
  - variable: ingress.certificate.mode
    label: "HTTPS mode"
    type: enum
    default: disabled
    required: true
    options:
      - disabled
      - existing
      - cert-manager
    group: "Domain / HTTPS"
    show_if: ingress.enabled=true
    description: "disabled: HTTP; existing: an existing TLS Secret; cert-manager: issue and renew a certificate using an existing issuer."
  - variable: ingress.certificate.issuerKind
    label: "Certificate issuer kind"
    type: enum
    default: ClusterIssuer
    required: true
    options:
      - ClusterIssuer
      - Issuer
    group: "Domain / HTTPS"
    show_if: ingress.enabled=true&&ingress.certificate.mode=cert-manager
  - variable: ingress.certificate.issuerName
    label: "Certificate issuer name"
    type: "reference[cert-manager.io.clusterissuer]"
    default: ""
    required: true
    group: "Domain / HTTPS"
    show_if: ingress.enabled=true&&ingress.certificate.mode=cert-manager&&ingress.certificate.issuerKind=ClusterIssuer
    description: "Select an existing, ready ClusterIssuer. cert-manager must already be installed."
  # Separate issuer selectors so Rancher remounts the selector when the kind changes.
  - variable: ingress.certificate.secretName
    label: "TLS Secret name"
    type: string
    default: casdoor-tls
    required: true
    group: "Domain / HTTPS"
    show_if: ingress.enabled=true
    description: "Existing Secret in existing mode; Secret to create in cert-manager mode. Ignored in disabled mode."
  - variable: ingress.certificate.issuerName
    label: "Certificate issuer name"
    type: "reference[cert-manager.io.issuer]"
    default: ""
    required: true
    group: "Domain / HTTPS"
    show_if: ingress.enabled=true&&ingress.certificate.mode=cert-manager&&ingress.certificate.issuerKind=Issuer
    description: "Select an existing, ready Issuer in the installation namespace."
  - variable: origin
    label: "Public origin override (optional)"
    type: string
    default: ""
    group: "Domain / HTTPS"
    description: "Leave empty to derive http(s)://hostname from Ingress. Set the complete public origin when TLS terminates elsewhere."
  - variable: initData.enabled
    label: "Initialize providers from a Secret"
    type: boolean
    default: "false"
    required: true
    group: "Object storage"
    description: "Automatically import S3 / MinIO (including Silo) providers; no manual admin-console setup is required. The initialization file can be in the same Secret as the environment variables. This does not create buckets."
  - variable: initData.existingSecret
    label: "Provider initialization Secret"
    type: "reference[secret]"
    default: ""
    required: true
    group: "Object storage"
    show_if: initData.enabled=true
    description: "Secret containing init_data.yaml with Casdoor providers and optional applications. You can select casdoor-env to keep everything in one Secret. Store S3 access keys here instead of Helm values; imported providers are retained in the database. Updates are merged; supplied fields overwrite database values."
  - variable: initData.existingSecretKey
    label: "Initialization Secret key"
    type: string
    default: init_data.yaml
    required: true
    group: "Object storage"
    show_if: initData.enabled=true
    description: "The Secret key containing initialization data; .yaml/.yml uses YAML, other extensions use JSON."
  - variable: defaultStorageProvider
    label: "Default storage provider (optional)"
    type: string
    default: ""
    group: "Object storage"
    description: "Name of an admin-owned provider for default avatar storage, such as storage-silo. Create it in Casdoor or import it from the initialization Secret. Applications still need their provider associations. No bucket or file PVC is created."
  - variable: storageProxy.enabled
    label: "Enable Caddy file proxy"
    type: boolean
    default: "false"
    required: true
    group: "Object storage"
    description: "Runs Caddy alongside Casdoor, reading S3_ENDPOINT and S3_BUCKET from the same environment Secret. Only GET/HEAD object reads from that bucket are allowed. Keep Silo internal and grant anonymous GetObject only on the dedicated upload bucket."
  - variable: storageProxy.image
    label: "Caddy image"
    type: string
    default: caddy:2.11.7-alpine
    required: true
    group: "Object storage"
    show_if: storageProxy.enabled=true
    description: "Full Caddy image including its version or digest. No S3 signing plugin or proxy credentials are required."
  - variable: storageProxy.hostname
    label: "File proxy hostname"
    type: hostname
    default: files.example.com
    required: true
    group: "Domain / HTTPS"
    show_if: storageProxy.enabled=true
    description: "Separate from the Casdoor hostname. Enable Ingress to create its route; it shares the Ingress Class and HTTPS settings. Existing certificates must cover both hostnames. Set the Casdoor storage Provider Domain to http(s)://this-hostname and Path prefix to the bucket name."
  - variable: resources.requests.cpu
    label: "CPU request"
    type: string
    default: 100m
    required: true
    group: "CPU / memory"
  - variable: resources.limits.cpu
    label: "CPU limit"
    type: string
    default: 1000m
    required: true
    group: "CPU / memory"
  - variable: resources.requests.memory
    label: "Memory request"
    type: string
    default: 256Mi
    required: true
    group: "CPU / memory"
  - variable: resources.limits.memory
    label: "Memory limit"
    type: string
    default: 1Gi
    required: true
    group: "CPU / memory"
