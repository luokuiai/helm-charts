{{- if not .Values.auth.useExistingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "netbird-proxy.secretName" . }}
  labels:
    {{- include "netbird-proxy.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.auth.secretKey | quote }}: {{ required "auth.token is required unless auth.useExistingSecret=true" .Values.auth.token | b64enc | quote }}
{{- end }}
