image:
  repository: netbirdio/reverse-proxy
  tag: "0.81.2"
  pullPolicy: IfNotPresent

proxy:
  managementAddress: ""
  # Bare hostname matching the proxy cluster configured in NetBird.
  domain: ""
  logLevel: info
  private: true
  forwardedProto: https
  # Enable together with the upstream load balancer's PROXY protocol v2.
  proxyProtocol: false
  trustedProxies: ""

auth:
  # Do not commit real tokens. An existing Secret keeps them out of Helm values.
  token: ""
  useExistingSecret: false
  existingSecret: ""
  secretKey: token

tls:
  # The proxy issues and renews certificates by default; existingSecret is optional.
  mode: acme
  existingSecret: ""
  # Used for both NB_PROXY_CERTIFICATE_DIRECTORY and the volume mount.
  certificateDirectory: /certs
  acme:
    challengeType: tls-alpn-01
    directory: https://acme-v02.api.letsencrypt.org/directory

service:
  # ClusterIP can share the existing Traefik entrypoint through TLS passthrough.
  type: ClusterIP
  httpsPort: 443
  httpsNodePort: 0
  # HTTP is exposed only for ACME http-01, not for application traffic.
  httpPort: 80
  httpNodePort: 0
  annotations: {}

traefik:
  # Requires Traefik v3 and the traefik.io IngressRouteTCP CRD.
  enabled: true
  entryPoint: websecure

persistence:
  # Used only in acme mode; certificates survive Helm uninstall.
  existingClaim: ""
  storageClass: local-path
  size: 1Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# Additional upstream variables, including valueFrom.secretKeyRef if needed.
# Names already managed by this chart cannot be overridden here.
extraEnv: []
