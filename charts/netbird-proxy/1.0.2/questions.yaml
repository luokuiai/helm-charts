questions:
  - variable: proxy.envSecret
    label: "NetBird Proxy 环境变量 Secret"
    type: "reference[secret]"
    default: netbird-proxy-env
    required: true
    group: "环境变量"
    description: "选择安装命名空间中已有的 Secret，包含 NB_PROXY_MANAGEMENT_ADDRESS、NB_PROXY_DOMAIN、NB_PROXY_TOKEN、NB_PROXY_PROXY_PROTOCOL、NB_PROXY_TRUSTED_PROXIES 等配置。更新 Secret 后需重启 Deployment。"
  - variable: proxy.domain
    label: "Traefik 路由域名"
    type: hostname
    default: ""
    required: true
    group: "域名 / HTTPS"
    description: "供 Helm 生成 Traefik TCP 路由；须与环境变量 Secret 中的 NB_PROXY_DOMAIN 一致。填写 proxy.example.com 这样的主域名，不带协议或通配符。"
  - variable: tls.mode
    label: "HTTPS 证书来源"
    type: enum
    options: [acme, existingSecret]
    default: acme
    required: true
    group: "域名 / HTTPS"
    description: "acme（默认）：NetBird Proxy 自行申请、续期证书，无需 TLS Secret 或 ClusterIssuer；existingSecret：挂载已有证书并关闭 NetBird ACME。Traefik 只透传 TLS。"
  - variable: tls.existingSecret
    label: "已有 TLS Secret"
    type: "reference[secret]"
    default: ""
    required: true
    show_if: tls.mode=existingSecret
    group: "域名 / HTTPS"
    description: "从安装命名空间选择已有 Secret。列表不按证书类型过滤；它必须含 tls.crt 和 tls.key，证书须覆盖所有实际使用的服务域名，如 *.proxy.example.com；若使用 proxy.example.com，也须覆盖该主域名。续期由现有流程负责。"
  - variable: persistence.existingClaim
    label: "已有证书 PVC（可选）"
    type: string
    default: ""
    show_if: tls.mode=acme
    group: "域名 / HTTPS"
    description: "留空则创建并保留新的 PVC；已有 PVC 必须位于安装命名空间，且 UID/GID 1000 可写。重新安装并复用旧证书时填写原 PVC 名称。"
  - variable: persistence.storageClass
    label: "证书 PVC 存储类"
    type: storageclass
    default: local-path
    show_if: tls.mode=acme
    group: "域名 / HTTPS"
    description: "创建新 PVC 时使用；请确认集群中存在该存储类。"
  - variable: persistence.size
    label: "证书 PVC 容量"
    type: string
    default: "128Mi"
    required: true
    show_if: tls.mode=acme
    group: "域名 / HTTPS"
    description: "仅创建新 PVC 时使用，可填 128Mi、256Mi 等；已有 PVC 不能直接缩容，升级时请保持原容量。"
  - variable: geo.downloadUrl
    label: "Geo 数据库下载地址（.mmdb.gz）"
    type: string
    default: https://cdn.jsdelivr.net/npm/geolite2-city/GeoLite2-City.mmdb.gz
    group: "Geo 数据库"
    description: "部署时由 init 容器从此 HTTPS 地址下载 gzip 压缩的 GeoLite2-City.mmdb，解压后交给 NetBird 使用。每次创建新 Pod 都会重新下载；下载失败则 Proxy 暂不启动。留空则由 NetBird 访问其官方地址。"
  - variable: geo.image
    label: "Geo 下载镜像"
    type: string
    default: curlimages/curl:8.21.0
    required: true
    group: "镜像"
    description: "供 Geo 下载 init 容器使用，可填写集群能够拉取的镜像地址。"
  - variable: image.repository
    label: "Proxy 镜像仓库"
    type: string
    default: netbirdio/reverse-proxy
    required: true
    group: "镜像"
  - variable: image.tag
    label: "Proxy 镜像标签"
    type: string
    default: "0.81.4"
    required: true
    group: "镜像"
    description: "覆盖默认镜像标签时，请确认环境变量和健康检查路径兼容。"
  - variable: resources.requests.cpu
    label: "CPU 请求量"
    type: string
    default: 100m
    required: true
    group: "CPU / 内存"
  - variable: resources.limits.cpu
    label: "CPU 上限"
    type: string
    default: 1000m
    required: true
    group: "CPU / 内存"
  - variable: resources.requests.memory
    label: "内存请求量"
    type: string
    default: 256Mi
    required: true
    group: "CPU / 内存"
  - variable: resources.limits.memory
    label: "内存上限"
    type: string
    default: 1Gi
    required: true
    group: "CPU / 内存"
