{{- include "netbird-proxy.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "netbird-proxy.fullname" . }}
  labels:
    {{- include "netbird-proxy.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "netbird-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "netbird-proxy.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      {{- if .Values.geo.downloadUrl }}
      initContainers:
        - name: geo-download
          image: {{ .Values.geo.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              dir=/var/lib/netbird/geolocation
              archive="$dir/GeoLite2-City.mmdb.gz.tmp"
              database="$dir/GeoLite2-City_$(date -u +%Y%m%d).mmdb"
              mkdir -p "$dir"
              curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 --retry-all-errors --connect-timeout 30 --max-time 600 --output "$archive" "$GEO_DOWNLOAD_URL"
              gzip -dc "$archive" > "$database.tmp"
              test -s "$database.tmp"
              mv "$database.tmp" "$database"
              rm "$archive"
          env:
            - name: GEO_DOWNLOAD_URL
              value: {{ .Values.geo.downloadUrl | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: state
              mountPath: /var/lib/netbird
      {{- end }}
      containers:
        - name: proxy
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: https
              containerPort: 8443
            - name: health
              containerPort: 8080
            {{- if and (eq .Values.tls.mode "acme") (eq .Values.tls.acme.challengeType "http-01") }}
            - name: acme-http
              containerPort: 8081
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.proxy.envSecret | quote }}
          env:
            - name: NB_PROXY_ADDRESS
              value: ":8443"
            - name: NB_PROXY_HEALTH_ADDRESS
              value: ":8080"
            - name: NB_PROXY_SUPPORTS_CUSTOM_PORTS
              value: "false"
            {{- if .Values.geo.downloadUrl }}
            - name: NB_PROXY_GEO_DATA_DIR
              value: /var/lib/netbird/geolocation
            {{- end }}
            - name: NB_PROXY_CERTIFICATE_DIRECTORY
              value: {{ .Values.tls.certificateDirectory | quote }}
            - name: NB_PROXY_CERTIFICATE_FILE
              value: tls.crt
            - name: NB_PROXY_CERTIFICATE_KEY_FILE
              value: tls.key
            - name: NB_PROXY_ACME_CERTIFICATES
              value: {{ eq .Values.tls.mode "acme" | quote }}
            {{- if eq .Values.tls.mode "acme" }}
            - name: NB_PROXY_CERT_LOCK_METHOD
              value: flock
            - name: NB_PROXY_ACME_ADDRESS
              value: ":8081"
            - name: NB_PROXY_ACME_DIRECTORY
              value: {{ .Values.tls.acme.directory | quote }}
            - name: NB_PROXY_ACME_CHALLENGE_TYPE
              value: {{ .Values.tls.acme.challengeType | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz/startup
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: health
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: certs
              mountPath: {{ .Values.tls.certificateDirectory | quote }}
              readOnly: {{ eq .Values.tls.mode "existingSecret" }}
            - name: state
              mountPath: /var/lib/netbird
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: certs
          {{- if eq .Values.tls.mode "existingSecret" }}
          secret:
            secretName: {{ .Values.tls.existingSecret | quote }}
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "netbird-proxy.claimName" . | quote }}
          {{- end }}
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
