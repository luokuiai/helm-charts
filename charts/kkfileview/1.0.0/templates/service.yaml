apiVersion: v1
kind: Service
metadata:
  name: {{ include "kkfileview.fullname" . }}
  labels:
    {{- include "kkfileview.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "kkfileview.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8012
      targetPort: http
      protocol: TCP
