apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.issuer.name | quote }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | quote }}
spec:
  acme:
    email: {{ .Values.acme.email | quote }}
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: {{ printf "%s-production-account-key" .Values.issuer.name | quote }}
    solvers:
      - selector:
          dnsZones:
            - {{ .Values.alidns.dnsZone | quote }}
        dns01:
          webhook:
            groupName: {{ .Values.webhook.groupName | quote }}
            solverName: alidns-solver
            config:
              regionId: {{ .Values.alidns.regionId | quote }}
              accessTokenSecretRef:
                name: {{ .Values.alidns.existingSecret | quote }}
                key: ACCESS_TOKEN
              secretKeySecretRef:
                name: {{ .Values.alidns.existingSecret | quote }}
                key: SECRET_KEY
