# Install in cert-manager's cluster resource namespace, normally cert-manager.
# Requires cert-manager, the DEVmachine-fr AliDNS webhook, and an existing credential Secret.
issuer:
  name: letsencrypt-alidns

acme:
  # Required. Used for Let's Encrypt account registration.
  email: ""
  environment: production

alidns:
  # Required. The DNS zone hosted by Alibaba Cloud, without a wildcard or URL.
  dnsZone: ""
  existingSecret: alidns-secrets
  # These keys hold AccessKey ID and AccessKey Secret respectively.
  accessKeyIdKey: access-token
  accessKeySecretKey: secret-key
  regionId: cn-beijing

webhook:
  # Must exactly match groupName in the existing AliDNS webhook installation.
  groupName: acme.luokuiai.com
