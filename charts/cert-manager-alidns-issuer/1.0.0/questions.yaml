questions:
  - variable: issuer.name
    label: "ClusterIssuer 名称"
    type: string
    default: letsencrypt-alidns
    required: true
    group: "证书签发器"
    description: "应用选择证书签发器时使用的集群级名称，升级时请保持不变。若已手动导入同名资源，请使用新名称，避免重复管理。"
  - variable: acme.email
    label: "Let's Encrypt 账号邮箱"
    type: string
    default: ""
    required: true
    group: "证书签发器"
    description: "填写 Let's Encrypt 账号的真实联系邮箱。"
  - variable: alidns.dnsZone
    label: "阿里云 DNS 区域"
    type: hostname
    default: ""
    required: true
    group: "证书签发器"
    description: "填写由阿里云托管的公共 DNS 区域，例如 luokuiai.com。不要填写应用子域名、通配符、URL 或 NetBird 内部域。"
  - variable: alidns.existingSecret
    label: "AliDNS 凭据 Secret"
    type: "reference[secret]"
    default: alidns-secrets
    required: true
    group: "证书签发器"
    description: "选择已有 Secret：ACCESS_TOKEN 填 AccessKey ID，SECRET_KEY 填 AccessKey Secret。此 Chart 应安装在 cert-manager 的集群资源命名空间中（通常为 cert-manager），以便下拉列表显示正确的 Secret。"
  - variable: webhook.groupName
    label: "AliDNS Webhook 组名"
    type: hostname
    default: ""
    required: true
    group: "Webhook 配置"
    description: "必须与已有 AliDNS Webhook 的 Helm 配置中 groupName 完全一致。这是 API 标识符，无需创建对应的 DNS 记录。"
  - variable: alidns.regionId
    label: "阿里云 API 区域"
    type: string
    default: cn-beijing
    required: true
    group: "Webhook 配置"
    description: "AliDNS API 客户端区域，与 Webhook 上游示例保持一致。"
