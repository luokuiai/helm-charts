apiVersion: v1
kind: Service
metadata:
  name: {{ include "iconf-sdzz.fullname" . }}
  labels:
    {{- include "iconf-sdzz.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "iconf-sdzz.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
