questions:
  - variable: image.repository
    label: "iconf-sdzz 镜像"
    type: string
    default: harbor.luokuiai.com/iconf-sdzz
    required: true
    group: "部署"
    description: "可填写镜像标签或摘要；不填写标签时使用 latest。"
  - variable: image.pullSecret
    label: "镜像仓库 Secret（可选）"
    type: "reference[secret]"
    default: ""
    group: "部署"
    description: "私有 Harbor 需要时，选择安装命名空间中已有的镜像拉取 Secret。"
  - variable: configMap
    label: "应用配置 ConfigMap"
    type: "reference[configmap]"
    default: iconf-sdzz-config
    required: true
    group: "部署"
    description: "选择同命名空间的 ConfigMap，使用 application-prod.yml 配置数据库、Redis、S3 等；修改后重启工作负载。"
  - variable: redis.enabled
    label: "部署内置 Redis"
    type: boolean
    default: false
    group: "Redis"
    description: "启用后应用自动连接本次部署的 Redis；关闭则使用 ConfigMap 中的外部 Redis 配置。"
  - variable: redis.image.repository
    label: "Redis 镜像"
    type: string
    default: redis:7.4
    required: true
    group: "Redis"
    show_if: redis.enabled=true
  - variable: redis.image.pullSecret
    label: "Redis 镜像仓库 Secret（可选）"
    type: "reference[secret]"
    default: ""
    group: "Redis"
    show_if: redis.enabled=true
  - variable: redis.redis.configSecret
    label: "Redis 配置 Secret（可选）"
    type: "reference[secret]"
    default: ""
    group: "Redis"
    show_if: redis.enabled=true
    description: "留空不设置密码，应用配置中也应清除旧密码；选择包含 redis.conf 的 Secret 可设置密码，应用配置中需填写相同密码。"
  - variable: redis.persistence.existingClaim
    label: "Redis 已有数据 PVC（可选）"
    type: "reference[persistentvolumeclaim]"
    default: ""
    group: "Redis"
    show_if: redis.enabled=true
    description: "留空自动创建 PVC；选择已有 PVC 前请确认数据兼容。"
  - variable: redis.persistence.storageClass
    label: "Redis 存储类"
    type: storageclass
    default: local-path
    group: "Redis"
    show_if: redis.enabled=true
  - variable: redis.persistence.size
    label: "Redis 存储容量"
    type: string
    default: 10Gi
    required: true
    group: "Redis"
    show_if: redis.enabled=true
  - variable: redis.resources.requests.cpu
    label: "Redis CPU 请求量"
    type: string
    default: 100m
    required: true
    group: "Redis"
    show_if: redis.enabled=true
  - variable: redis.resources.limits.cpu
    label: "Redis CPU 上限"
    type: string
    default: "1"
    required: true
    group: "Redis"
    show_if: redis.enabled=true
  - variable: redis.resources.requests.memory
    label: "Redis 内存请求量"
    type: string
    default: 256Mi
    required: true
    group: "Redis"
    show_if: redis.enabled=true
  - variable: redis.resources.limits.memory
    label: "Redis 内存上限"
    type: string
    default: 1Gi
    required: true
    group: "Redis"
    show_if: redis.enabled=true
  - variable: ingress.enabled
    label: "启用域名访问（Ingress）"
    type: boolean
    default: false
    group: "域名 / HTTPS"
    description: "默认仅通过集群内部 Service 访问。启用前请确认网络访问权限和文档隐私要求。"
  - variable: ingress.host
    label: "域名"
    type: hostname
    default: iconf-sdzz.example.com
    required: true
    group: "域名 / HTTPS"
    show_if: ingress.enabled=true
  - variable: ingress.className
    label: "Ingress 类"
    type: "reference[networking.k8s.io.ingressclass]"
    default: ""
    group: "域名 / HTTPS"
    show_if: ingress.enabled=true
    description: "选择已有的 Ingress 类；留空使用集群默认类。"
  - variable: ingress.certificate.mode
    label: "HTTPS 模式"
    type: enum
    default: disabled
    required: true
    options:
      - disabled
      - existing
      - cert-manager
    group: "域名 / HTTPS"
    show_if: ingress.enabled=true
    description: "existing 使用已有证书；cert-manager 使用已有签发器；disabled 使用 HTTP。"
  - variable: ingress.certificate.issuerKind
    label: "证书签发器类型"
    type: enum
    default: ClusterIssuer
    required: true
    options:
      - ClusterIssuer
      - Issuer
    group: "域名 / HTTPS"
    show_if: ingress.enabled=true&&ingress.certificate.mode=cert-manager
  - variable: ingress.certificate.issuerName
    label: "证书签发器名称"
    type: "reference[cert-manager.io.clusterissuer]"
    default: ""
    required: true
    group: "域名 / HTTPS"
    show_if: ingress.enabled=true&&ingress.certificate.mode=cert-manager&&ingress.certificate.issuerKind=ClusterIssuer
  - variable: ingress.certificate.issuerName
    label: "证书签发器名称"
    type: "reference[cert-manager.io.issuer]"
    default: ""
    required: true
    group: "域名 / HTTPS"
    show_if: ingress.enabled=true&&ingress.certificate.mode=cert-manager&&ingress.certificate.issuerKind=Issuer
  - variable: ingress.certificate.secretName
    label: "已有 TLS 证书"
    type: "reference[secret]"
    default: iconf-sdzz-tls
    required: true
    group: "域名 / HTTPS"
    show_if: ingress.enabled=true&&ingress.certificate.mode=existing
    description: "选择安装命名空间中已有的 TLS Secret。"
  - variable: ingress.certificate.secretName
    label: "证书保存的 Secret 名称"
    type: string
    default: iconf-sdzz-tls
    required: true
    group: "域名 / HTTPS"
    show_if: ingress.enabled=true&&ingress.certificate.mode=cert-manager
    description: "填写 cert-manager 签发证书后保存的 Secret 名称。"
  - variable: resources.requests.cpu
    label: "CPU 请求量"
    type: string
    default: "1"
    required: true
    group: "CPU / 内存"
  - variable: resources.limits.cpu
    label: "CPU 上限"
    type: string
    default: "2"
    required: true
    group: "CPU / 内存"
  - variable: resources.requests.memory
    label: "内存请求量"
    type: string
    default: 2Gi
    required: true
    group: "CPU / 内存"
  - variable: resources.limits.memory
    label: "内存上限"
    type: string
    default: 4Gi
    required: true
    group: "CPU / 内存"
    description: "请根据应用负载和文件大小调整。"
