apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "iconf-sdzz.fullname" . }}
  labels:
    {{- include "iconf-sdzz.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "iconf-sdzz.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "iconf-sdzz.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ . | quote }}
      {{- end }}
      containers:
        - name: iconf-sdzz
          image: {{ required "image.repository is required" .Values.image.repository | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: STORAGE_TYPE
              value: s3
            {{- if .Values.redis.enabled }}
            - name: SPRING_DATA_REDIS_HOST
              value: {{ include "redis.fullname" (dict "Release" .Release "Values" .Values.redis) | quote }}
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ required "configMap is required" .Values.configMap | quote }}
