questions:
  - variable: "komodo.replicas"
    label: "Komodo 副本数"
    type: "int"
    default: "1"
    required: true
    group: "应用"
    description: "正常运行时使用 1；设置为 0 可暂时停止 Core。"
    min: 0
    max: 1
  - variable: "komodo.image.repository"
    label: "Komodo 镜像仓库"
    type: "string"
    default: "moghtech/komodo-core"
    required: true
    group: "镜像"
  - variable: "komodo.image.tag"
    label: "Komodo 镜像标签"
    type: "string"
    default: "2"
    required: true
    group: "镜像"
    description: "建议填写明确的镜像版本，以便重复部署。标签 2 会随上游更新。"
  - variable: "mongo.image.tag"
    label: "MongoDB 镜像标签"
    type: "string"
    default: "8"
    required: true
    group: "镜像"
  - variable: "komodo.envSecret"
    label: "Komodo / MongoDB 环境变量 Secret"
    type: "string"
    default: "komodo-env"
    required: true
    group: "环境变量"
    description: "安装命名空间中的 Secret，包含 KOMODO_DATABASE_USERNAME、KOMODO_DATABASE_PASSWORD，以及 JWT、Webhook、OIDC 等配置。MongoDB 与 Komodo 共用此 Secret。"
  - variable: "komodo.ingress.enabled"
    label: "启用域名访问（Ingress）"
    type: "boolean"
    default: "false"
    required: true
    group: "域名 / HTTPS"
    description: "创建 Ingress，将域名请求转发到 Komodo。DNS 解析需在 DNS 服务商处另行配置。"
  - variable: "komodo.ingress.hosts.0.host"
    label: "域名"
    type: "hostname"
    default: "komodo.example.com"
    required: true
    group: "域名 / HTTPS"
    show_if: "komodo.ingress.enabled=true"
    description: "只填写域名，例如 komodo.luokuiai.com。同时将环境变量 Secret 中的 KOMODO_HOST 更新为完整的外部访问 URL。"
  - variable: "komodo.ingress.className"
    label: "Ingress 类"
    type: "reference[networking.k8s.io.ingressclass]"
    default: ""
    group: "域名 / HTTPS"
    show_if: "komodo.ingress.enabled=true"
    description: "选择已有 Ingress 类，K3s 通常选择 traefik；留空使用集群默认 Ingress 类。"
  - variable: "komodo.ingress.certificate.mode"
    label: "HTTPS 模式"
    type: "enum"
    default: "disabled"
    required: true
    options:
      - "disabled"
      - "existing"
      - "cert-manager"
    group: "域名 / HTTPS"
    show_if: "komodo.ingress.enabled=true"
    description: "disabled：关闭 HTTPS；existing：使用已有 TLS Secret；cert-manager：自动申请并续期证书。"
  - variable: "komodo.ingress.certificate.issuerKind"
    label: "证书签发器类型"
    type: "enum"
    default: "ClusterIssuer"
    required: true
    options:
      - "ClusterIssuer"
      - "Issuer"
    group: "域名 / HTTPS"
    show_if: "komodo.ingress.enabled=true&&komodo.ingress.certificate.mode=cert-manager"
    description: "ClusterIssuer 可跨命名空间共用；Issuer 必须与 Komodo 位于同一命名空间。"
  - variable: "komodo.ingress.certificate.issuerName"
    label: "证书签发器名称"
    type: "reference[cert-manager.io.clusterissuer]"
    default: ""
    required: true
    group: "域名 / HTTPS"
    show_if: "komodo.ingress.enabled=true&&komodo.ingress.certificate.mode=cert-manager&&komodo.ingress.certificate.issuerKind=ClusterIssuer"
    description: "选择已有且就绪的 ClusterIssuer；若列表为空，请先创建。需先安装 cert-manager。"
  # Keep a different component between the selectors so Rancher remounts the resource selector when the issuer kind changes.
  - variable: "komodo.ingress.certificate.secretName"
    label: "TLS Secret 名称"
    type: "string"
    default: "komodo-tls"
    required: true
    group: "域名 / HTTPS"
    show_if: "komodo.ingress.enabled=true"
    description: "existing 模式填写安装命名空间中的已有 TLS Secret；cert-manager 模式填写要创建的 Secret 名称。disabled 模式忽略此项。"
  - variable: "komodo.ingress.certificate.issuerName"
    label: "证书签发器名称"
    type: "reference[cert-manager.io.issuer]"
    default: ""
    required: true
    group: "域名 / HTTPS"
    show_if: "komodo.ingress.enabled=true&&komodo.ingress.certificate.mode=cert-manager&&komodo.ingress.certificate.issuerKind=Issuer"
    description: "选择安装命名空间中已有且就绪的 Issuer，不能使用其他命名空间的 Issuer。"
  - variable: "mongo.persistence.storageClass"
    label: "MongoDB 存储类"
    type: "storageclass"
    default: "local-path"
    required: true
    group: "MongoDB 存储"
  - variable: "mongo.persistence.size"
    label: "MongoDB 存储容量"
    type: "string"
    default: "10Gi"
    required: true
    group: "MongoDB 存储"
  - variable: "komodo.persistence.config.storageClass"
    label: "配置与密钥存储类"
    type: "storageclass"
    default: "local-path"
    required: true
    group: "Komodo 文件存储"
  - variable: "komodo.persistence.config.size"
    label: "配置与密钥存储容量"
    type: "string"
    default: "1Gi"
    required: true
    group: "Komodo 文件存储"
  - variable: "komodo.persistence.backups.enabled"
    label: "持久化保存 /backups"
    type: "boolean"
    default: "true"
    required: true
    group: "Komodo 文件存储"
  - variable: "komodo.persistence.backups.storageClass"
    label: "备份存储类"
    type: "storageclass"
    default: "local-path"
    required: true
    group: "Komodo 文件存储"
    show_if: "komodo.persistence.backups.enabled=true"
  - variable: "komodo.persistence.backups.size"
    label: "备份存储容量"
    type: "string"
    default: "5Gi"
    required: true
    group: "Komodo 文件存储"
    show_if: "komodo.persistence.backups.enabled=true"
  - variable: "komodo.resources.requests.cpu"
    label: "Komodo CPU 请求量"
    type: "string"
    default: "100m"
    required: true
    group: "Komodo CPU / 内存"
    description: "1000m 等于 1 个 CPU 核心。"
  - variable: "komodo.resources.limits.cpu"
    label: "Komodo CPU 上限"
    type: "string"
    default: "1000m"
    required: true
    group: "Komodo CPU / 内存"
  - variable: "komodo.resources.requests.memory"
    label: "Komodo 内存请求量"
    type: "string"
    default: "128Mi"
    required: true
    group: "Komodo CPU / 内存"
    description: "根据实际负载调整，使用 Mi 或 Gi 单位。"
  - variable: "komodo.resources.limits.memory"
    label: "Komodo 内存上限"
    type: "string"
    default: "512Mi"
    required: true
    group: "Komodo CPU / 内存"
  - variable: "mongo.resources.requests.cpu"
    label: "MongoDB CPU 请求量"
    type: "string"
    default: "100m"
    required: true
    group: "MongoDB CPU / 内存"
    description: "1000m 等于 1 个 CPU 核心。"
  - variable: "mongo.resources.limits.cpu"
    label: "MongoDB CPU 上限"
    type: "string"
    default: "1000m"
    required: true
    group: "MongoDB CPU / 内存"
  - variable: "mongo.resources.requests.memory"
    label: "MongoDB 内存请求量"
    type: "string"
    default: "256Mi"
    required: true
    group: "MongoDB CPU / 内存"
    description: "根据实际负载调整，使用 Mi 或 Gi 单位。"
  - variable: "mongo.resources.limits.memory"
    label: "MongoDB 内存上限"
    type: "string"
    default: "1Gi"
    required: true
    group: "MongoDB CPU / 内存"
