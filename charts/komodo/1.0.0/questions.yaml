questions:
  - variable: "komodo.replicas"
    label: "Komodo replicas"
    type: "int"
    default: "1"
    required: true
    group: "Application"
    description: "Use 1 for normal operation. Set to 0 to stop Core temporarily."
    min: 0
    max: 1
  - variable: "komodo.image.repository"
    label: "Komodo image repository"
    type: "string"
    default: "moghtech/komodo-core"
    required: true
    group: "Images"
  - variable: "komodo.image.tag"
    label: "Komodo image tag"
    type: "string"
    default: "2"
    required: true
    group: "Images"
    description: "Use an exact image version for reproducible deployments. The tag 2 is a floating tag."
  - variable: "mongo.image.tag"
    label: "MongoDB image tag"
    type: "string"
    default: "8"
    required: true
    group: "Images"
  - variable: "komodo.envSecret"
    label: "Komodo / MongoDB environment Secret"
    type: "string"
    default: "komodo-env"
    required: true
    group: "Environment"
    description: "A Secret in the installation namespace containing KOMODO_DATABASE_USERNAME, KOMODO_DATABASE_PASSWORD, JWT, Webhook, OIDC, and other settings. Shared by MongoDB and Komodo."
  - variable: "komodo.ingress.enabled"
    label: "Enable domain access (Ingress)"
    type: "boolean"
    default: "false"
    required: true
    group: "Domain / HTTPS"
    description: "Create an Ingress to route requests for the hostname to Komodo. Configure DNS separately with your DNS provider."
  - variable: "komodo.ingress.hosts.0.host"
    label: "Hostname"
    type: "hostname"
    default: "komodo.example.com"
    required: true
    group: "Domain / HTTPS"
    show_if: "komodo.ingress.enabled=true"
    description: "Enter only the hostname, such as komodo.luokuiai.com. Also update KOMODO_HOST in the environment Secret to the complete public URL."
  - variable: "komodo.ingress.className"
    label: "Ingress Class"
    type: "reference[networking.k8s.io.ingressclass]"
    default: ""
    group: "Domain / HTTPS"
    show_if: "komodo.ingress.enabled=true"
    description: "Select an existing Ingress Class, usually traefik on K3s. Leave empty to use the default Ingress Class in the cluster."
  - variable: "komodo.ingress.certificate.mode"
    label: "HTTPS mode"
    type: "enum"
    default: "disabled"
    required: true
    options:
      - "disabled"
      - "existing"
      - "cert-manager"
    group: "Domain / HTTPS"
    show_if: "komodo.ingress.enabled=true"
    description: "disabled: disable HTTPS; existing: use an existing TLS Secret; cert-manager: automatically request and renew a certificate."
  - variable: "komodo.ingress.certificate.issuerKind"
    label: "Certificate issuer kind"
    type: "enum"
    default: "ClusterIssuer"
    required: true
    options:
      - "ClusterIssuer"
      - "Issuer"
    group: "Domain / HTTPS"
    show_if: "komodo.ingress.enabled=true&&komodo.ingress.certificate.mode=cert-manager"
    description: "A ClusterIssuer can be shared across namespaces. An Issuer must be in the same namespace as Komodo."
  - variable: "komodo.ingress.certificate.issuerName"
    label: "Certificate issuer name"
    type: "reference[cert-manager.io.clusterissuer]"
    default: ""
    required: true
    group: "Domain / HTTPS"
    show_if: "komodo.ingress.enabled=true&&komodo.ingress.certificate.mode=cert-manager&&komodo.ingress.certificate.issuerKind=ClusterIssuer"
    description: "Select an existing, ready ClusterIssuer. If none are available, create one first. cert-manager must already be installed."
  # Keep a different component between the selectors so Rancher remounts the resource selector when the issuer kind changes.
  - variable: "komodo.ingress.certificate.secretName"
    label: "TLS Secret name"
    type: "string"
    default: "komodo-tls"
    required: true
    group: "Domain / HTTPS"
    show_if: "komodo.ingress.enabled=true"
    description: "In existing mode, enter a TLS Secret in the installation namespace. In cert-manager mode, enter the Secret name to create. Ignored in disabled mode."
  - variable: "komodo.ingress.certificate.issuerName"
    label: "Certificate issuer name"
    type: "reference[cert-manager.io.issuer]"
    default: ""
    required: true
    group: "Domain / HTTPS"
    show_if: "komodo.ingress.enabled=true&&komodo.ingress.certificate.mode=cert-manager&&komodo.ingress.certificate.issuerKind=Issuer"
    description: "Select an existing, ready Issuer in the installation namespace. Issuers in other namespaces are not available."
  - variable: "mongo.persistence.storageClass"
    label: "MongoDB storage class"
    type: "storageclass"
    default: "local-path"
    required: true
    group: "MongoDB storage"
  - variable: "mongo.persistence.size"
    label: "MongoDB storage size"
    type: "string"
    default: "10Gi"
    required: true
    group: "MongoDB storage"
  - variable: "komodo.persistence.config.storageClass"
    label: "Configuration and keys storage class"
    type: "storageclass"
    default: "local-path"
    required: true
    group: "Komodo file storage"
  - variable: "komodo.persistence.config.size"
    label: "Configuration and keys storage size"
    type: "string"
    default: "1Gi"
    required: true
    group: "Komodo file storage"
  - variable: "komodo.persistence.backups.enabled"
    label: "Persist /backups"
    type: "boolean"
    default: "true"
    required: true
    group: "Komodo file storage"
  - variable: "komodo.persistence.backups.storageClass"
    label: "Backup storage class"
    type: "storageclass"
    default: "local-path"
    required: true
    group: "Komodo file storage"
    show_if: "komodo.persistence.backups.enabled=true"
  - variable: "komodo.persistence.backups.size"
    label: "Backup storage size"
    type: "string"
    default: "5Gi"
    required: true
    group: "Komodo file storage"
    show_if: "komodo.persistence.backups.enabled=true"
  - variable: "komodo.resources.requests.cpu"
    label: "Komodo CPU request"
    type: "string"
    default: "100m"
    required: true
    group: "Komodo CPU / memory"
    description: "1000m equals 1 CPU core."
  - variable: "komodo.resources.limits.cpu"
    label: "Komodo CPU limit"
    type: "string"
    default: "1000m"
    required: true
    group: "Komodo CPU / memory"
  - variable: "komodo.resources.requests.memory"
    label: "Komodo memory request"
    type: "string"
    default: "128Mi"
    required: true
    group: "Komodo CPU / memory"
    description: "Adjust for the actual workload. Use Mi or Gi units."
  - variable: "komodo.resources.limits.memory"
    label: "Komodo memory limit"
    type: "string"
    default: "512Mi"
    required: true
    group: "Komodo CPU / memory"
  - variable: "mongo.resources.requests.cpu"
    label: "MongoDB CPU request"
    type: "string"
    default: "100m"
    required: true
    group: "MongoDB CPU / memory"
    description: "1000m equals 1 CPU core."
  - variable: "mongo.resources.limits.cpu"
    label: "MongoDB CPU limit"
    type: "string"
    default: "1000m"
    required: true
    group: "MongoDB CPU / memory"
  - variable: "mongo.resources.requests.memory"
    label: "MongoDB memory request"
    type: "string"
    default: "256Mi"
    required: true
    group: "MongoDB CPU / memory"
    description: "Adjust for the actual workload. Use Mi or Gi units."
  - variable: "mongo.resources.limits.memory"
    label: "MongoDB memory limit"
    type: "string"
    default: "1Gi"
    required: true
    group: "MongoDB CPU / memory"
