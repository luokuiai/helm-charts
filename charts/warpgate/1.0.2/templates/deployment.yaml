{{- if .Release.IsUpgrade }}
{{- $oldKind := ternary "Deployment" "StatefulSet" .Values.ha.enabled }}
{{- $old := lookup "apps/v1" $oldKind .Release.Namespace (include "warpgate.fullname" .) }}
{{- if and $old (or (gt (int $old.spec.replicas) 0) (gt (int (dig "status" "replicas" 0 $old)) 0)) }}
{{- fail "Changing ha.enabled requires scaling the previous workload to 0 and waiting for its Pods to terminate; migrate recording files as described in docs/warpgate/deployment.md" }}
{{- end }}
{{- end }}
{{- if .Values.ha.enabled }}
{{- if not .Values.persistence.enabled }}
{{- fail "HA requires persistence.enabled=true to retain each Pod's configuration and recording buffers" }}
{{- end }}
{{- if .Values.persistence.existingClaim }}
{{- fail "HA requires independent data PVCs; persistence.existingClaim is only supported in single-node mode" }}
{{- end }}
{{- if not .Values.recordings.s3.enabled }}
{{- $name := required "HA requires ha.sharedRecordingsClaim (ReadWriteMany), or recordings.s3.enabled" .Values.ha.sharedRecordingsClaim }}
{{- $claim := lookup "v1" "PersistentVolumeClaim" .Release.Namespace $name }}
{{- if and $claim (not (has "ReadWriteMany" $claim.spec.accessModes)) }}
{{- fail "ha.sharedRecordingsClaim must support ReadWriteMany" }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: {{ ternary "StatefulSet" "Deployment" .Values.ha.enabled }}
metadata:
  name: {{ include "warpgate.fullname" . }}
  labels:
    {{- include "warpgate.labels" . | nindent 4 }}
spec:
  {{- if .Values.ha.enabled }}
  serviceName: {{ include "warpgate.fullname" . }}-peers
  replicas: {{ .Values.ha.replicas }}
  # Fully bootstrap the first Pod before another Pod uses the shared database.
  podManagementPolicy: OrderedReady
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  updateStrategy:
    type: RollingUpdate
  {{- else }}
  replicas: 1
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "warpgate.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "warpgate.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.warpgate.backendTLSSecret }}
        checksum/backend-tls: {{ include (print $.Template.BasePath "/backend-tls-secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.ha.enabled }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "warpgate.selectorLabels" . | nindent 18 }}
      {{- end }}
      initContainers:
        - name: install-config
          image: {{ include "warpgate.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - internal-install-files
            {{- if .Values.oidc.enabled }}
            - --substitute-env=WARPGATE_DATABASE_URL WARPGATE_OIDC_CLIENT_SECRET
            {{- else }}
            - --substitute-env=WARPGATE_DATABASE_URL
            {{- end }}
            - /seed
            - /data
          {{- include "warpgate.environment" . | nindent 10 }}
          env:
            - name: WARPGATE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.warpgate.envSecret | quote }}
                  key: WARPGATE_DATABASE_URL
            {{- if .Values.oidc.enabled }}
            - name: WARPGATE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.warpgate.envSecret | quote }}
                  key: WARPGATE_OIDC_CLIENT_SECRET
            {{- end }}
          securityContext:
            {{- include "warpgate.containerSecurityContext" . | nindent 12 }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: seed
              mountPath: /seed
              readOnly: true
        - name: setup
          image: {{ include "warpgate.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config=/data/warpgate.yaml
            - unattended-setup
            - --if-config-exists=bootstrap
            - --data-path=/data
            - --http-port=8888
            {{- range $name, $protocol := .Values.protocols }}
            {{- if $protocol.enabled }}
            - --{{ $name }}-port={{ $protocol.port }}
            {{- end }}
            {{- end }}
            {{- if .Values.warpgate.recordSessions }}
            - --record-sessions
            {{- end }}
          {{- include "warpgate.environment" . | nindent 10 }}
          env:
            - name: WARPGATE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.warpgate.envSecret | quote }}
                  key: WARPGATE_ADMIN_PASSWORD
          securityContext:
            {{- include "warpgate.containerSecurityContext" . | nindent 12 }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if and .Values.ha.enabled (not .Values.recordings.s3.enabled) }}
            - name: shared-recordings
              mountPath: /data/recordings
            {{- end }}
      {{- if .Values.recordings.s3.enabled }}
        - name: configure-recordings
          image: {{ .Values.recordings.s3.setupImage | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [psql]
          args:
            - --no-psqlrc
            - --set=ON_ERROR_STOP=1
            - --dbname=$(WARPGATE_DATABASE_URL)
            - --file=/seed/configure-recordings.sql
          {{- include "warpgate.environment" . | nindent 10 }}
          env:
            - name: WARPGATE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.warpgate.envSecret | quote }}
                  key: WARPGATE_DATABASE_URL
            - name: WARPGATE_RECORDINGS_STORAGE
              value: {{ dict
                "kind" "S3"
                "bucket" .Values.recordings.s3.bucket
                "region" .Values.recordings.s3.region
                "endpoint" (default nil .Values.recordings.s3.endpoint)
                "prefix" .Values.recordings.s3.prefix
                "path_style" .Values.recordings.s3.pathStyle
                "credentials" (dict "mode" "Auto")
                "scratch_path" "/data/recordings-scratch"
                | toJson | quote }}
          securityContext:
            {{- include "warpgate.containerSecurityContext" . | nindent 12 }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: seed
              mountPath: /seed
              readOnly: true
      {{- end }}
      containers:
        - name: warpgate
          image: {{ include "warpgate.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [--config=/data/warpgate.yaml, run]
          {{- include "warpgate.environment" . | nindent 10 }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- if .Values.ha.enabled }}
            - name: WARPGATE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.warpgate.envSecret | quote }}
                  key: WARPGATE_ENCRYPTION_KEY
            {{- end }}
            {{- if .Values.recordings.s3.enabled }}
            {{- range list "AWS_ACCESS_KEY_ID" "AWS_SECRET_ACCESS_KEY" }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.warpgate.envSecret | quote }}
                  key: {{ . }}
            {{- end }}
            {{- end }}
          securityContext:
            {{- include "warpgate.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: https
              containerPort: 8888
            {{- range $name, $protocol := .Values.protocols }}
            {{- if $protocol.enabled }}
            - name: {{ $name }}
              containerPort: {{ $protocol.port }}
            {{- end }}
            {{- end }}
          {{- range $name := list "startup" "readiness" "liveness" }}
          {{ $name }}Probe:
            exec:
              command: [/usr/local/bin/warpgate, --config=/data/warpgate.yaml, healthcheck]
            timeoutSeconds: 10
            periodSeconds: {{ ternary 5 20 (eq $name "startup") }}
            failureThreshold: {{ ternary 60 3 (eq $name "startup") }}
          {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if and .Values.ha.enabled (not .Values.recordings.s3.enabled) }}
            - name: shared-recordings
              mountPath: /data/recordings
            {{- end }}
      volumes:
        {{- if not .Values.ha.enabled }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "warpgate.claimName" . }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.persistence.size | quote }}
          {{- end }}
        {{- end }}
        {{- if and .Values.ha.enabled (not .Values.recordings.s3.enabled) }}
        - name: shared-recordings
          persistentVolumeClaim:
            claimName: {{ .Values.ha.sharedRecordingsClaim | quote }}
        {{- end }}
        - name: seed
          projected:
            sources:
              - configMap:
                  name: {{ include "warpgate.fullname" . }}-config
              - secret:
                  name: {{ include "warpgate.backendTLSSecret" . }}
                  items:
                    - key: tls.crt
                      path: tls.certificate.pem
                    - key: tls.key
                      path: tls.key.pem
  {{- if .Values.ha.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "warpgate.labels" . | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
  {{- end }}
