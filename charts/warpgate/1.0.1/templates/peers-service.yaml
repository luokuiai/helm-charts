{{- if .Values.ha.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "warpgate.fullname" . }}-peers
  labels:
    {{- include "warpgate.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "warpgate.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: 8888
      targetPort: https
{{- end }}
