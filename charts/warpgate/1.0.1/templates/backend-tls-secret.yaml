{{- if not .Values.warpgate.backendTLSSecret }}
{{- $name := include "warpgate.backendTLSSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $certificate := "" }}
{{- $key := "" }}
{{- if $existing }}
{{- $certificate = required "Existing backend TLS Secret must contain tls.crt" (index $existing.data "tls.crt") }}
{{- $key = required "Existing backend TLS Secret must contain tls.key" (index $existing.data "tls.key") }}
{{- else }}
{{- $host := include "warpgate.backendServerName" . }}
{{- $generated := genSelfSignedCert $host nil (list $host "localhost") 3650 }}
{{- $certificate = $generated.Cert | b64enc }}
{{- $key = $generated.Key | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "warpgate.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
  tls.crt: {{ $certificate }}
  tls.key: {{ $key }}
  ca.crt: {{ $certificate }}
{{- end }}
