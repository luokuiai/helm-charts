apiVersion: v1
kind: Service
metadata:
  name: {{ include "warpgate.fullname" . }}
  labels:
    {{- include "warpgate.labels" . | nindent 4 }}
  {{- $annotations := deepCopy .Values.service.annotations }}
  {{- if and .Values.ingress.enabled (eq .Values.ingress.controller "traefik") }}
  {{- $_ := set $annotations "traefik.ingress.kubernetes.io/service.serversscheme" "https" }}
  {{- $_ := set $annotations "traefik.ingress.kubernetes.io/service.serverstransport" (printf "%s-%s-backend@kubernetescrd" .Release.Namespace (include "warpgate.fullname" .)) }}
  {{- end }}
  {{- with $annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "warpgate.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: 8888
      targetPort: https
      {{- if and (ne .Values.service.type "ClusterIP") .Values.service.httpsNodePort }}
      nodePort: {{ .Values.service.httpsNodePort }}
      {{- end }}
    {{- range $name, $protocol := .Values.protocols }}
    {{- if $protocol.enabled }}
    - name: {{ $name }}
      port: {{ $protocol.port }}
      targetPort: {{ $name }}
      {{- if and (ne $.Values.service.type "ClusterIP") $protocol.nodePort }}
      nodePort: {{ $protocol.nodePort }}
      {{- end }}
    {{- end }}
    {{- end }}
