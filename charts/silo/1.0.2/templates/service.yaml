apiVersion: v1
kind: Service
metadata:
  name: {{ include "silo.fullname" . }}
  labels:
    {{- include "silo.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
  selector:
    {{- include "silo.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "silo.fullname" . }}-headless
  labels:
    {{- include "silo.labels" . | nindent 4 }}
spec:
  clusterIP: None
  # Peers must resolve before any Pod becomes ready during initial formatting.
  publishNotReadyAddresses: true
  ports:
    - name: api
      port: 9000
      targetPort: api
  selector:
    {{- include "silo.selectorLabels" . | nindent 4 }}
