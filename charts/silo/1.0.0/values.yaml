# 1 = standalone; 2-16 = one distributed erasure set, one PVC per Pod.
# Select this at installation. Changing it later is not a supported pool expansion.
replicaCount: 1
clusterDomain: cluster.local

image:
  # Full image reference, including its version or digest.
  repository: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
  pullPolicy: IfNotPresent
imagePullSecrets: []

silo:
  # Existing Secret containing MINIO_ROOT_USER, MINIO_ROOT_PASSWORD and other environment variables.
  envSecret: silo-env

auth:
  # Legacy fallback used only when silo.envSecret is empty.
  rootUser: silo-admin
  rootPassword: ""
  useExistingSecret: false
  # Required fields: rootUser and rootPassword, in the installation namespace.
  existingSecret: ""

persistence:
  # Only supported with replicaCount=1; must be writable by UID/GID 1000.
  existingClaim: ""
  storageClass: local-path
  # Per PVC, before erasure coding overhead. Empty storageClass uses the cluster default.
  size: 10Gi

ingress:
  enabled: false
  # Independent routes; both remain enabled for compatibility with existing values.
  apiEnabled: true
  consoleEnabled: true
  className: ""
  annotations: {}
  apiHost: s3.example.com
  consoleHost: silo.example.com
  certificate:
    mode: disabled # disabled | existing | cert-manager
    secretName: silo-tls
    issuerKind: ClusterIssuer
    issuerName: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

nodeSelector: {}
tolerations: []
