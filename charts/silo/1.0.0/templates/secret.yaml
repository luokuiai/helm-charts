{{- if and (not .Values.silo.envSecret) (not .Values.auth.useExistingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "silo.secretName" . }}
  labels:
    {{- include "silo.labels" . | nindent 4 }}
type: Opaque
data:
  rootUser: {{ required "Set auth.rootUser or use an existing Secret" .Values.auth.rootUser | b64enc | quote }}
  rootPassword: {{ required "Set auth.rootPassword or use an existing Secret" .Values.auth.rootPassword | b64enc | quote }}
{{- end }}
