# Replace this placeholder with your database password before applying.
# Use the installation namespace. Keep the completed Secret out of Git.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-env
  namespace: infra
type: Opaque
stringData:
  POSTGRES_PASSWORD: REPLACE_WITH_YOUR_DATABASE_PASSWORD
  # Optional; leave unset to use the initial username as the database name.
  # POSTGRES_DB: appdb
