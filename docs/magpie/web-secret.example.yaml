# Replace this placeholder with the output of: openssl rand -hex 16
# The real key must have at least 16 characters from letters, digits, - . _ ~.
# Keep the completed Secret out of Git. Use the installation namespace.
apiVersion: v1
kind: Secret
metadata:
  name: magpie-env
  namespace: ai
type: Opaque
stringData:
  MAGPIE_WEB_KEY: REPLACE_WITH_A_RANDOM_WEB_KEY
