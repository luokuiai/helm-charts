# Replace credentials, endpoints and namespace before applying. Keep the result out of Git.
# Create the bucket and a scoped application access key in Silo separately.
# Give anonymous users only s3:GetObject on arn:aws:s3:::casdoor/*.
# This is a complete alternative to env-secret.example.yaml, using ONE Secret.
apiVersion: v1
kind: Secret
metadata:
  name: casdoor-env
  namespace: identity
type: Opaque
stringData:
  dataSourceName: "host=postgres.database.svc.cluster.local port=5432 user=casdoor password=REPLACE_WITH_PASSWORD dbname=casdoor sslmode=require"
  initAdminPassword: REPLACE_WITH_A_LONG_RANDOM_PASSWORD
  defaultStorageProvider: storage-silo
  # Caddy receives the same Secret as Casdoor. Keep these in sync with the provider below.
  S3_ENDPOINT: http://silo.storage.svc.cluster.local:9000
  S3_BUCKET: casdoor
  # Select casdoor-env as initData.existingSecret to import this file automatically.
  # S3_* configures Caddy; Casdoor imports its provider from this file instead.
  init_data.yaml: |
    providers:
      - owner: admin
        name: storage-silo
        displayName: Silo uploads
        category: Storage
        type: MinIO
        clientId: REPLACE_WITH_SILO_ACCESS_KEY
        clientSecret: REPLACE_WITH_SILO_SECRET_KEY
        regionId: us-east-1
        bucket: casdoor
        endpoint: http://silo.storage.svc.cluster.local:9000
        domain: https://files.example.com
        pathPrefix: casdoor
