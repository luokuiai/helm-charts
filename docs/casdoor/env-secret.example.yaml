# Replace the placeholders and match the installation namespace before applying.
# Casdoor environment variable names are case-sensitive. Keep real credentials out of Git.
apiVersion: v1
kind: Secret
metadata:
  name: casdoor-env
  namespace: identity
type: Opaque
stringData:
  dataSourceName: "host=postgres.database.svc.cluster.local port=5432 user=casdoor password=REPLACE_WITH_PASSWORD dbname=casdoor sslmode=require"
  # Used only when Casdoor creates the initial administrator; not a password reset.
  initAdminPassword: REPLACE_WITH_A_LONG_RANDOM_PASSWORD
  # Optional overrides; environment values take precedence over the form/app.conf.
  # origin: https://auth.example.com
  # forceLanguage: "zh"
  # Optional Caddy sidecar: reads these from this same environment Secret.
  # S3_ENDPOINT: http://silo.storage.svc.cluster.local:9000
  # S3_BUCKET: casdoor
  # For automatic provider setup in this same Secret, use s3-init-secret.example.yaml.

# For MySQL, replace dataSourceName with a DSN ending in /:
#   dataSourceName: "casdoor:REPLACE_WITH_PASSWORD@tcp(mysql.database.svc.cluster.local:3306)/"
# Set database.driver=mysql and database.databaseName=casdoor in the form.
