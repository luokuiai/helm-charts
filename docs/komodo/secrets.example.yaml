# Edit locally. Never send the completed secrets file or .env to the assistant.
# MongoDB and Core both read database credentials from this single Secret.
apiVersion: v1
kind: Secret
metadata:
  name: komodo-env
  namespace: prod
type: Opaque
stringData:
  TZ: Asia/Shanghai
  KOMODO_HOST: https://komodo.luokuiai.com
  KOMODO_TITLE: Komodo
  # For release komodo; use the matching MongoDB Service for another release name.
  KOMODO_DATABASE_ADDRESS: komodo-mongo:27017
  KOMODO_DATABASE_DB_NAME: komodo
  KOMODO_DATABASE_USERNAME: "REPLACE_MONGO_USERNAME"
  KOMODO_DATABASE_PASSWORD: "REPLACE_MONGO_PASSWORD"
  KOMODO_LOCAL_AUTH: "true"
  KOMODO_JWT_TTL: 1-day
  KOMODO_JWT_SECRET: "REPLACE_OLD_KOMODO_JWT_SECRET"
  KOMODO_WEBHOOK_SECRET: "REPLACE_OLD_KOMODO_WEBHOOK_SECRET"
  KOMODO_INIT_ADMIN_USERNAME: "REPLACE_OLD_KOMODO_INIT_ADMIN_USERNAME"
  KOMODO_INIT_ADMIN_PASSWORD: "REPLACE_OLD_KOMODO_INIT_ADMIN_PASSWORD"
  KOMODO_OIDC_ENABLED: "true"
  KOMODO_OIDC_PROVIDER: https://auth.luokuiai.com
  KOMODO_OIDC_CLIENT_ID: "REPLACE_OLD_KOMODO_OIDC_CLIENT_ID"
  KOMODO_OIDC_CLIENT_SECRET: "REPLACE_OLD_KOMODO_OIDC_CLIENT_SECRET"
  KOMODO_OIDC_USE_FULL_EMAIL: "true"
  KOMODO_DISABLE_LOCAL_USER_REGISTRATION: "true"
  KOMODO_DISABLE_USER_REGISTRATION: "false"
  KOMODO_ENABLE_NEW_USERS: "false"
  KOMODO_TRANSPARENT_MODE: "false"
  KOMODO_DISABLE_NON_ADMIN_CREATE: "true"
