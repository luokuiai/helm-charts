# 应用前替换域名、管理端 URL、可信来源 IP/CIDR 和 Token。
# 不要把真实 Token 提交到 Git；此 Secret 应位于 Chart 的安装命名空间。
apiVersion: v1
kind: Secret
metadata:
  name: netbird-proxy-env
  namespace: netbird
type: Opaque
stringData:
  NB_PROXY_MANAGEMENT_ADDRESS: "https://netbird.example.com:443"
  NB_PROXY_DOMAIN: "proxy.example.com"
  NB_PROXY_TOKEN: "REPLACE_NETBIRD_PROXY_TOKEN"
  NB_PROXY_PRIVATE: "true"
  NB_PROXY_LOG_LEVEL: "info"
  NB_PROXY_FORWARDED_PROTO: "https"
  NB_PROXY_PROXY_PROTOCOL: "true"
  # 未限制 Pod 间访问时填 Traefik Pod IP（/32），Pod 重建后需更新。
  # 若填 10.42.0.0/24 等 Pod 网段，需限制仅 Traefik Pod 可连接 Proxy。
  NB_PROXY_TRUSTED_PROXIES: "REPLACE_TRAEFIK_SOURCE_IP_OR_CIDR"
