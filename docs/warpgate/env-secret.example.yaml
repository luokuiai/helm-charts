# Replace placeholders and the namespace before applying. Keep real credentials out of Git.
apiVersion: v1
kind: Secret
metadata:
  name: warpgate-env
  namespace: access
type: Opaque
stringData:
  # Required external PostgreSQL database. Create the database/user first.
  # Percent-encode reserved characters in the URL credentials; select sslmode
  # to match your database (require for TLS; disable only for a trusted non-TLS endpoint).
  WARPGATE_DATABASE_URL: "postgresql://warpgate:REPLACE_WITH_URL_ENCODED_CREDENTIAL@postgres.database.svc.cluster.local:5432/warpgate?sslmode=require"
  # Sets the initial admin user only; does not reset an existing account.
  WARPGATE_ADMIN_PASSWORD: REPLACE_WITH_A_LONG_RANDOM_PASSWORD
  # Required only with oidc.enabled=true. Use the provider application's raw,
  # single-line Client Secret; do not base64-encode it in stringData.
  WARPGATE_OIDC_CLIENT_SECRET: REPLACE_WITH_OIDC_CLIENT_SECRET
  # Required only with recordings.s3.enabled=true. Use a dedicated S3 identity
  # scoped to the recordings bucket/prefix, with multipart upload/read/delete rights.
  # AWS_ACCESS_KEY_ID: REPLACE_WITH_S3_ACCESS_KEY_ID
  # AWS_SECRET_ACCESS_KEY: REPLACE_WITH_S3_SECRET_ACCESS_KEY
  # Required in HA; optional for a single node. All replicas use this same key.
  # Generate once using: openssl rand -base64 32
  # Preserve the actual encryption key with backups; do not replace it on restart.
  # WARPGATE_ENCRYPTION_KEY: REPLACE_WITH_A_BASE64_ENCODED_32_BYTE_KEY
  # If you configure HTTP(S)_PROXY here, also append warpgate-cluster.internal
  # to NO_PROXY and no_proxy so direct HA peer traffic bypasses that proxy.
